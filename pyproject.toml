[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ardupilot-research-mcp"
version = "0.1.0"
description = "Local, offline, cited ArduPilot knowledge MCP server (stdio, read-only)"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "mcp==1.30.0",   # pinned: see docs/research-notes.md for the verified SDK surface
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ardupilot-research-mcp = "ardupilot_research_mcp.server:main"
ardupilot-research-ingest = "ardupilot_research_mcp.ingest.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ardupilot_research_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
