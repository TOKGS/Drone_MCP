      - "libraries/AP_AHRS/**"
      - "libraries/AP_AIS/**"
      - "libraries/AP_AdvancedFailsafe/**"
      - "libraries/AP_Airspeed/**"
      - "libraries/AP_Avoidance/**"
      - "libraries/AP_BLHeli/**"
      - "libraries/AP_Baro/**"
      - "libraries/AP_BattMonitor/**"
