# Variant corpus: the same seven sources, but ArduPilot is pinned to the 4.6 series
# (Copter-4.6.2) instead of the newest tag. This exists because a fleet on 4.6 firmware
# got wrong answers from the 4.7 pin: ARMING_CHECK is found only in 4.6, ATC_ACCEL_* are
# renamed in 4.7. Everything else is identical to sources.yaml, so the two files must stay
# in sync (tests/test_variant.py enforces it). Build into data/4.6, never over data/.
# `ref` is a tag or a commit SHA — never a branch name.

version: 1
resolved_at: "2026-10-26"
corpus_root: data/4.6/corpus
licenses_dir: data/4.6/licenses

# Extensions never copied into the corpus, whatever the includes say.
exclude_ext:
  [".png", ".jpg", ".jpeg", ".gif", ".webp", ".svg", ".ico", ".pdf", ".zip", ".gz",
   ".bz2", ".7z", ".bin", ".hex", ".apj", ".elf", ".a", ".o", ".so", ".dll", ".exe",
   ".otf", ".ttf", ".woff", ".woff2", ".wav", ".mp3", ".mp4", ".mov", ".psd",
   ".pyc", ".whl", ".jar", ".tflite", ".uf2", ".dfu"]

# Always kept if present, even when a rule would exclude them.
always_include:
  ["LICENSE", "LICENSE.md", "LICENSE.txt", "COPYING", "COPYING.md", "COPYING.txt",
   "NOTICE", "README.md", "README.rst"]

sources:
  - id: ardupilot
    repo: ArduPilot/ardupilot
    ref: Copter-4.6.2
    ref_kind: tag
    tier: T1
    license: GPL-3.0
    license_file: COPYING
    version_label: "Copter-4.6.2"
    note: "Firmware source of truth: hwdef, RC protocols, params, bootloader tooling."
    include:
      - "libraries/AP_HAL_ChibiOS/hwdef/**"
      - "libraries/AP_HAL_ESP32/**"
      - "libraries/AP_HAL/**"
      - "libraries/AP_RCProtocol/**"
      - "libraries/RC_Channel/**"
      - "libraries/AP_Arming/**"
      - "libraries/AP_Common/**"
      - "libraries/AP_InertialSensor/**"
      - "libraries/AP_Param/**"
      - "libraries/AP_Math/**"
      - "libraries/AP_GPS/**"
      - "Tools/autotest/**"
      - "Tools/scripts/**"
      - "Tools/bootloaders/**"
      - "ArduCopter/**"
      # Every library that declares `// @Param` metadata at the pin (scripts/param_coverage.py).
      # Without these the corpus holds the group declaration but not the parameter itself, so
      # lookup_param answers found:false for parameters that exist in the release.
      - "libraries/AC_AttitudeControl/**"
      - "libraries/AC_AutoTune/**"
      - "libraries/AC_Autorotation/**"
      - "libraries/AC_Avoidance/**"
      - "libraries/AC_CustomControl/**"
