    en: ["battery", "batt"]
  - vi: "động cơ"
    en: ["motor"]
  - vi: "cổng nối tiếp"
    en: ["serial port", "SERIAL"]
  - vi: "kênh"
    en: ["channel"]
  - vi: "khung"
    en: ["frame", "airframe"]
  - vi: "cánh quạt"
    en: ["propeller", "prop"]
  - vi: "ghi log"
    en: ["log", "logging"]
  - vi: "đọc log"
    en: ["log analysis", "log"]
  - vi: "bản đồ"
    en: ["map"]
  - vi: "an toàn"
    en: ["safety", "failsafe", "fence"]
  - vi: "lưu vào bộ nhớ"
    en: ["store", "storage", "eeprom", "persistent"]
  - vi: "bộ nhớ"
    en: ["memory", "storage", "eeprom"]
  - vi: "cảm biến rung"
    en: ["vibration", "accelerometer", "accel"]
  - vi: "rung"
    en: ["vibration", "vibrations"]
  - vi: "đọc ở đâu"
    en: ["where is", "definition", "source"]
  - vi: "xử lý thế nào"
    en: ["how does", "behaviour", "handling"]
  # Concepts the v4 dev split asked for in Vietnamese that the corpus only spells in English.
  # Every entry is a phrase, never a bare common word ("giá", "thời tiết"), so an out-of-scope
  # question cannot borrow an anchor from it.
  - vi: "bán kính"
    en: ["radius"]
  - vi: "hàng rào"
    en: ["fence", "geofence"]
  - vi: "gia tốc thẳng đứng"
    en: ["vertical acceleration", "accel z"]
  - vi: "giảm tốc"
    en: ["deceleration", "brake"]
  - vi: "phanh"
    en: ["brake", "braking", "deceleration"]
  - vi: "bù nhiệt"
    en: ["temperature compensation", "temp cal", "temperature calibration"]
  - vi: "học bù nhiệt"
    en: ["temperature calibration", "temp cal"]
  - vi: "nhiễu la bàn"
    en: ["compass interference", "compass motor compensation", "compassmot"]
  - vi: "công suất phát"
    en: ["transmit power", "tx power", "dynamic power"]
  - vi: "dòng pin"
    en: ["battery current", "batt amps", "current pin"]
  - vi: "hệ số dòng pin"
    en: ["amps per volt", "battery current scale"]
  - vi: "độ nhạy điều khiển"
