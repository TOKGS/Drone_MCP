  - vi: "điểm smartrtl"
    en: ["smartrtl points", "srtl points"]
  - vi: "tốc độ gói tin"
    en: ["packet rate", "rate"]
  # Vietnamese typed without diacritics is a real user habit; the same phrases again in ASCII so
