  expect:
  - source: expresslrs_docs
    path: docs/quick-start/ardupilot-setup.md
  answer_snippet: ArduPilot Firmware must be 4.1 or higher to run CRSF protocol.
- id: V5-MENTION-007
  q: Lam sao nap firmware ExpressLRS cho receiver qua Betaflight passthrough?
  lang: vi
  diacritics: false
  category: elrs_edgetx
  expect:
  - source: expresslrs_docs
    path: docs/software/updating/betaflight-passthrough.md
  answer_snippet: Once you have Flashed ELRS onto your receivers they can be conveniently updated using
    the passthrough feature of Betaflight (and similar FC FW).
- id: V5-MENTION-008
  q: trong EdgeTX, file crsf_measure.cpp liet ke nhung muc baud nao
