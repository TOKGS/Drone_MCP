# Eval set v5-mention: questions that ASK about the pinned corpus (ArduPilot, Copter, ExpressLRS,
# ELRS, EdgeTX, CRSF, MAVLink, Mission Planner, ...) and also name another product (PX4, Betaflight,
# iNav, Cleanflight, KISS, QGroundControl). Every entry is positive: the corpus answers it, so a
# found:false here would mean the scope rule refused a question it should answer.
# Frozen by docs/eval-v5-mention.sha256; run once per kept configuration, aggregate output only.
version: 5
generated_by: independent writer, frozen by the lead
split: mention
questions:
- id: V5-MENTION-001
  q: Mạch mua về đang chạy Betaflight thì nạp ArduPilot lần đầu bằng cách nào?
  lang: vi
  category: wiki
  expect:
  - source: ardupilot_wiki
    path: common/source/docs/common-loading-firmware-onto-chibios-only-boards.rst
  answer_snippet: The ArduPilot bootloader and firmware are loaded together over USB in DFU (direct firmware
    upload) mode.
- id: V5-MENTION-002
  q: Toi chuyen tu Betaflight sang ArduPilot tren Kakute H7 V2, co phai dao thu tu day motor khong?
  lang: vi
  diacritics: false
  category: wiki
  expect:
  - source: ardupilot_wiki
    path: common/source/docs/common-holybro-kakuteh7-v2.rst
  answer_snippet: For Copter firmware the FRAME_TYPE is already defaulted to type "12" (BetaFlight X)
    allowing existing BetaFlight configurations with ESCs attached to have the correct motor ordering
    without changes to the FRAME_TYPE and FRAME_CLASS parameters or ESC wiring.
- id: V5-MENTION-003
  q: Trong ArduPilot, muốn OSD MSP DisplayPort trên kính DJI dùng bảng font kiểu iNav thì đặt bit nào
    của MSP_OPTIONS?
  lang: vi
  category: wiki
  expect:
  - source: ardupilot_wiki
    path: common/source/docs/common-displayport.rst
  answer_snippet: Set bit 3 (+8 to value) to use iNAV style font table
- id: V5-MENTION-004
  q: Co ground station nao vua dung ArduPilot vua cau hinh duoc Betaflight khong?
  lang: vi
  diacritics: false
  category: wiki
  expect:
  - source: ardupilot_wiki
    path: common/source/docs/common-install-gcs.rst
  answer_snippet: Also supports Betaflight and iNav via MSP protocol.
- id: V5-MENTION-005
  q: ELRS dung giao thuc CRSF thi dau day vao ArduPilot giong TBS Crossfire phai khong?
  lang: vi
  diacritics: false
  category: wiki
  expect:
  - source: ardupilot_wiki
    path: common/source/docs/common-crsf-telemetry.rst
  answer_snippet: ELRS (ExpressLRS) RC systems use the CRSF protocol and are connected in a similar manner.
- id: V5-MENTION-006
  q: Cần firmware ArduPilot từ bản nào mới chạy được CRSF với ExpressLRS?
  lang: vi
