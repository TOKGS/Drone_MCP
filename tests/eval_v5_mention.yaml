  category: protocol
  expect:
  - source: ardupilot_wiki
    path: common/source/docs/common-msp-overview-4.2.rst
  answer_snippet: ArduPilot's MSP protocol module is ported from Betaflight and iNav, and supports both
    MSPV1 and MSPV2.
