  category: elrs_edgetx
  expect:
  - source: edgetx
    path: radio/src/targets/hrs/v15/crsf_measure.cpp
  answer_snippet: constexpr uint32_t BAUD_CANDIDATES[] = {400000u, 420000u, 115200u};
  diacritics: false
- id: V5-MENTION-009
  q: ELRS hybrid switch thi ArduPilot dat FLTMODE_CH bao nhieu?
  lang: vi
  diacritics: false
  category: elrs_edgetx
  expect:
  - source: expresslrs_docs
    path: docs/quick-start/ardupilot-setup.md
  answer_snippet: ArduPilot default flight modes channel is channel 8, but ELRS 8 position channel is
    on channel 12 (in hybrid switch mode).
- id: V5-MENTION-010
  q: Kết nối QGroundControl qua MAVLink High Latency thì phải chọn mục nào?
  lang: vi
  category: protocol
  expect:
  - source: ardupilot_wiki
    path: common/source/docs/common-MAVLink-high-latency.rst
  answer_snippet: In QGroundControl connect using the ``High Latency`` option to enable sending telemetry
    on the High Latency port
- id: V5-MENTION-011
