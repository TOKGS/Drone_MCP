# Golden evaluation set — used for tuning. The held-out set (tests/heldout_locked.yaml) is
# frozen and must NOT be used for tuning; it is evaluated once, at the end.
# A question may accept several targets: `expect` is a list of {source, path} pairs (path is a
# substring of the file path; "." accepts any file in that source). recall@5 = any top-5 result
# matching one pair; precision@1 = the first result matches; MRR = 1 / rank of the first match.
